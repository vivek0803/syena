[project]
name = "syena"
version = "0.1.0"
description = "Syena: single-user, transparent auto-trading platform for NSE"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "cryptography>=43",
    "typer>=0.12",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pandas>=2.2",
    "numpy>=1.26",
    "kiteconnect>=5.0",
    "anthropic>=0.40",
    "apscheduler>=3.10,<4",
    "feedparser>=6.0",
    "casparser>=0.7",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "qrcode>=7.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100"]

[project.scripts]
syena = "syena.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["syena*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
