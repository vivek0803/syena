name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Deterministic tests (17E) + lesson rules + auth + mode switch
        run: pytest
      - name: Parser eval gate (17A, 17H) - fails the build below thresholds
        run: syena eval-gate

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  release:
    # Every push to main that passes the tests above is marked as the "release" branch.
    # The server checks that branch every few minutes and deploys it (deploy/auto-deploy.sh), so no server key
    # is ever stored on GitHub, and code that fails the tests never reaches the server.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Mark this commit as the release
        run: git push --force origin HEAD:refs/heads/release
